<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Post</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e13">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 1.5rem; background: #0b0e13; color: #e6edf3;
         font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  h1 { font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; color: #7d8590; }
  button { background: #1f6feb; color: #fff; border: 0; padding: 0.6rem 1.2rem;
           border-radius: 6px; font-size: 1rem; cursor: pointer; }
  canvas { display: block; width: 100%; max-width: 640px; height: 256px;
           margin: 1rem 0; background: #05070a; border-radius: 6px; }
  #verdict { font-size: 1.25rem; font-weight: 600; margin: 0.5rem 0 1rem;
             font-variant-numeric: tabular-nums; }
  #verdict.detecting { color: #ff7b72; }
  .meter { display: grid; grid-template-columns: 9rem 1fr 3rem;
           align-items: center; gap: 0.75rem; margin: 0.35rem 0; }
  .meter-track { background: #161b22; border-radius: 3px; height: 10px; overflow: hidden; }
  .meter-fill { background: #3fb950; height: 100%; width: 0; transition: width 120ms linear; }
  .meter-value { font-variant-numeric: tabular-nums; color: #7d8590; text-align: right; }
  table { border-collapse: collapse; margin-top: 1.5rem; width: 100%; max-width: 640px; }
  th, td { text-align: left; padding: 0.35rem 0.75rem 0.35rem 0;
           border-bottom: 1px solid #21262d; font-variant-numeric: tabular-nums; }
  th { color: #7d8590; font-weight: 500; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>Listening Post</h1>
  <button id="start">Start listening</button>
  <canvas id="spectrogram" width="512" height="256"></canvas>
  <div id="verdict">Idle</div>
  <div id="meters"></div>
  <table id="log"></table>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
